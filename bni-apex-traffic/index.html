<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX — Traffic Light</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Bécane Paris minimal : white #F6F6F6, near-black #0A0A0A, spatial, tech-mono accents ===== */
:root{
  --bg:#F6F6F6; --fg:#0A0A0A; --muted:#8a8a8a; --line:#E2E2E2;
  --green:#15803d; --amber:#a16207; --red:#b91c1c;
  --g:#15803d; --y:#a16207; --r:#b91c1c; /* subtle semantic for score tags */
  --mono:'Space Grotesk',monospace; --sans:'Archivo',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--fg);min-height:100vh;padding:0 0 80px}
.wrap{max-width:1320px;margin:0 auto;padding:0 48px}

/* header - Becane nav style */
header{display:flex;justify-content:space-between;align-items:center;padding:26px 0;border-bottom:1px solid var(--line);margin-bottom:56px}
.brand{font-weight:900;font-size:1.3rem;letter-spacing:.18em;text-transform:uppercase}
.brand .light{font-weight:300;color:var(--muted)}
.nav{display:flex;gap:34px;align-items:center;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.nav a{color:var(--fg);text-decoration:none;transition:opacity .2s}
.nav a:hover{opacity:.5}
.nav .cnt{color:var(--muted)}
.nav .cta{font-family:var(--mono);font-size:.72rem;border-bottom:1.5px solid var(--fg);padding-bottom:2px}

/* hero title - huge Becane collection style */
.hero{margin-bottom:48px}
.hero .eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.hero h1{font-size:clamp(3rem,7.5vw,6rem);font-weight:800;letter-spacing:-.03em;line-height:.98}
.hero .row2{display:flex;gap:20px;align-items:baseline;flex-wrap:wrap;margin-top:8px}
.hero .stat{font-family:var(--mono);font-size:.85rem;letter-spacing:.06em;color:var(--muted)}
.hero .stat b{color:var(--fg);font-weight:700}

/* summary strip - invisible grid, no cards/borders */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:1px solid var(--line);margin-bottom:36px;padding-bottom:28px}
.sitem{display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--line);padding:0 28px}
.sitem:first-child{border-left:none;padding-left:0}
.sitem .n{font-size:2.4rem;font-weight:700;letter-spacing:-.02em;font-family:var(--mono)}
.sitem .l{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sitem .n.g{color:var(--g)}.sitem .n.y{color:#a16207}.sitem .n.r{color:var(--r)}

/* controls - minimal underline inputs */
.controls{display:flex;gap:28px;align-items:center;margin-bottom:44px;flex-wrap:wrap;font-family:var(--mono)}
.controls input[type=text]{font-family:var(--mono);background:transparent;border:none;border-bottom:1.5px solid var(--fg);font-size:.9rem;padding:8px 2px;color:var(--fg);outline:none;flex:1;min-width:220px;letter-spacing:.04em}
.controls input::placeholder{color:var(--muted);letter-spacing:.08em}
.controls select{font-family:var(--mono);background:transparent;border:none;border-bottom:1.5px solid var(--fg);font-size:.85rem;padding:8px 2px;color:var(--fg);cursor:pointer;outline:none}
.controls label{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* member grid - "game character select" feel: hover zoom, name reveal, sweep, select */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:48px 32px}
.mcard{cursor:pointer;position:relative;transition:transform .3s cubic-bezier(.2,.8,.2,1);border-radius:0}
.mcard:hover{transform:translateY(-10px)}
.mcard .thumb{position:relative;background:#ECECEC;aspect-ratio:3/4;overflow:hidden;transition:box-shadow .3s}
.mcard:hover .thumb{box-shadow:0 30px 60px rgba(0,0,0,.18)}
.mcard .thumb img{width:100%;height:100%;object-fit:cover;filter:grayscale(0) saturate(1.25);transition:transform .4s;transform:scale(1)} .mcard:hover .thumb img{transform:scale(1.06)}
/* sweep highlight on hover (character-select shine) */
.mcard .thumb::before{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.28) 50%,transparent 60%);transform:translateX(-120%);transition:transform .6s;z-index:2;pointer-events:none}
.mcard:hover .thumb::before{transform:translateX(120%)}
.mcard .thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55));pointer-events:none;opacity:0;transition:.3s}
.mcard:hover .thumb::after{opacity:1}
/* name banner reveals on hover (character name plate) */
.mcard .plate{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 14px;color:#fff;font-weight:700;font-size:1rem;z-index:3;opacity:0;transform:translateY(12px);transition:.3s;font-family:var(--sans)}
.mcard:hover .plate{opacity:1;transform:translateY(0)}
.mcard .plate .sc{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;opacity:.85}
.mcard .band-tag{position:absolute;top:12px;left:12px;font-family:var(--mono);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--bcol);padding:4px 10px;z-index:4}
.mcard .band-tag.bGREEN{background:var(--g)}.mcard .band-tag.bYELLOW{background:var(--y)}.mcard .band-tag.bRED{background:var(--r)}
.mcard .no-photo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:800;color:#c9c9c9}
.mcard .name{font-size:.95rem;font-weight:600;letter-spacing:.01em;line-height:1.3;margin-top:16px}
.mcard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-family:var(--mono)}
.mcard .score{font-size:1.4rem;font-weight:700}
.mcard .score small{font-size:.64rem;color:var(--muted);font-weight:400;margin-right:5px;letter-spacing:.06em}
.mcard .rank-txt{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mcard .hk-txt{font-size:.66rem;letter-spacing:.06em;color:#a16207;font-weight:600}

/* modal - Becane minimal */
.overlay{position:fixed;inset:0;background:rgba(246,246,246,.92);backdrop-filter:blur(4px);z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.overlay.show{display:flex}
.modal{background:#fff;max-width:680px;width:100%;max-height:92vh;overflow-y:auto;padding:48px;position:relative;border:1px solid var(--line)}
.modal .mportrait{display:block;width:100%;height:200px;object-fit:cover;object-position:top;margin-bottom:28px;filter:saturate(1.2);background:#ECECEC}
.modal h2{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.modal .msub{font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:32px}
.close{position:absolute;top:18px;right:18px;background:none;border:1px solid var(--fg);width:36px;height:36px;border-radius:50%;font-size:1.1rem;cursor:pointer;color:var(--fg)}
.catrow{display:flex;align-items:center;gap:18px;padding:14px 0;border-bottom:1px solid var(--line)}
.catrow .cl{width:88px;font-weight:600;font-size:.9rem;font-family:var(--mono);letter-spacing:.04em}
.catrow .cv{width:72px;font-family:var(--mono);font-weight:700;text-align:right}
.catrow .cbar{flex:1;height:2px;background:var(--line)}
.catrow .cbar>i{display:block;height:2px;background:var(--fg)}
.catrow .ok{font-size:.85rem;color:var(--g)}
.catrow .warn{font-size:.85rem;color:#a16207}
.catrow .sugg{font-size:.72rem;color:var(--muted);flex:1;text-align:right;font-family:var(--mono)}
.detail{margin-top:24px;font-size:.9rem;line-height:1.8;color:#333}
.detail b{color:var(--fg)}
.footer{margin-top:70px;text-align:center;font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@media(max-width:760px){
  .wrap{padding:0 22px}
  .hero h1{font-size:2.8rem}
  .summary{grid-template-columns:repeat(2,1fr);gap:24px 0}
  .sitem{border-left:none;padding:0}
  .grid{gap:32px 20px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .nav{gap:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">BNI <span class="light">APEX</span></div>
    <div class="nav">
      <a href="#">Collection</a>
      <span class="cnt">46</span>
      <a href="#" class="cta">Traffic Light ↗</a>
    </div>
  </header>

  <section class="hero">
    <div class="eyebrow">Giant Business · 2026 Score</div>
    <h1>Members<br>Score.</h1>
    <div class="row2">
      <span class="stat">Chapter HK <b>#<span id="chRank">—</span>/<span id="chTotal">—</span></b></span>
      <span class="stat">Period <b id="period">—</b></span>
    </div>
  </section>

  <section class="summary">
    <div class="sitem"><div class="n g" id="cG">0</div><div class="l">Green</div></div>
    <div class="sitem"><div class="n y" id="cY">0</div><div class="l">Yellow</div></div>
    <div class="sitem"><div class="n r" id="cR">0</div><div class="l">Red</div></div>
    <div class="sitem"><div class="n" id="cAvg">0</div><div class="l">Avg</div></div>
  </section>

  <div class="controls">
    <input type="text" id="search" placeholder="SEARCH MEMBER">
    <label>Band</label>
    <select id="bandFilter">
      <option value="ALL">ALL</option>
      <option value="GREEN">GREEN</option>
      <option value="YELLOW">YELLOW</option>
      <option value="RED">RED</option>
    </select>
    <label>Sort</label>
    <select id="sortBy">
      <option value="score">SCORE ↓</option>
      <option value="need">NEED</option>
      <option value="name">NAME</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>

  <div class="footer">APEX · Traffic Light · BNI Giant Business</div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close" onclick="closeModal()">✕</button>
    <img class="mportrait" id="mPortrait" src="" alt="">
    <h2 id="mName"></h2>
    <div class="msub" id="mSub"></div>
    <div id="mCats"></div>
    <div class="detail" id="mDetail"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
const store=window.TL_DATA;const members=store.members||[];const chapter=store.chapter||{};
const IK={'GREEN':'G','YELLOW':'Y','RED':'R'};
document.getElementById('period').textContent=store.report_period||'';
document.getElementById('chRank').textContent=chapter.rank||'—';
document.getElementById('chTotal').textContent=chapter.member_count||'—';
const avg=Math.round(members.reduce((s,m)=>s+(m.total||0),0)/Math.max(members.length,1));
document.getElementById('cAvg').textContent=avg;
document.getElementById('cG').textContent=members.filter(m=>m.band==='GREEN').length;
document.getElementById('cY').textContent=members.filter(m=>m.band==='YELLOW').length;
document.getElementById('cR').textContent=members.filter(m=>m.band==='RED').length;

const CATLBL=['出席','準時','引薦','嘉賓','1-2-1','培訓','生意提供'];
const MAXC={'出席':15,'準時':10,'引薦':20,'嘉賓':20,'1-2-1':10,'培訓':10,'生意提供':15};
const CONT={'出席':'#0A0A0A'};
function pct(v,mx){return Math.min(100,Math.round((v||0)/mx*100));}

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const bf=document.getElementById('bandFilter').value;
  const sb=document.getElementById('sortBy').value;
  let list=members.filter(m=>!q||m.name.toLowerCase().includes(q)).filter(m=>bf==='ALL'||m.band===bf);
  if(sb==='name')list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sb==='need')list.sort((a,b)=>(a.total||0)-(b.total||0));
  else list.sort((a,b)=>(b.total||0)-(a.total||0));
  const g=document.getElementById('grid');g.innerHTML='';
  for(const m of list){
    const c=document.createElement('div');c.className='mcard';c.onclick=()=>openModal(m);
    const img=m.photo?`<img src="${m.photo}" loading="lazy" alt="${m.name}" onerror="this.parentNode.classList.add('no-ph','no-img');this.remove()">`:('');
    c.innerHTML='<div class="thumb">'+(img||'<span class="no-photo">'+(m.name[0]||'?')+'</span>')+'<span class="band-tag b'+m.band+'">'+m.band+' '+m.total+'</span></div><div class="plate"><div>'+m.name+'</div><div class="sc">Rank '+m.rank+' · '+m.total+' pts</div></div></div><div class="name">'+m.name+'</div><div class="meta"><span class="rank-txt">Rank '+m.rank+'</span>'+(m.hk_rank?'<span class="hk-txt">HK '+m.hk_rank+'</span>':'<span class="score"><small>pts</small>'+(m.total||0)+'</span>')+'</div>';
    g.appendChild(c);
  }
}
document.getElementById('search').addEventListener('input',render);
document.getElementById('bandFilter').addEventListener('change',render);
document.getElementById('sortBy').addEventListener('change',render);

function openModal(m){
  const port=document.getElementById('mPortrait');
  if(m.photo){port.src=m.photo;port.style.display='block';}else{port.style.display='none';}
  document.getElementById('mName').textContent=m.name;
  document.getElementById('mSub').textContent=`Rank ${m.rank} · ${m.total} pts · ${m.band} ${m.hk_rank?'· HK '+m.hk_rank:''}`;
  const cats=document.getElementById('mCats');cats.innerHTML='';
  const gaps=m.gaps||[];const gm={};gaps.forEach(g=>gm[g.cat]=g);
  for(const c of CATLBL){
    const g=gm[c];const v=g?g.score:(m.cats[c]||0);const mx=MAXC[c];const full=v>=mx;
    const row=document.createElement('div');row.className='catrow';
    row.innerHTML=`<div class="cl">${c}</div><div class="cv">${v}/${mx}</div>
      <div class="cbar"><i style="width:${pct(v,mx)}%"></i></div>
      <span class="${full?'ok':'warn'}">${full?'✓':'✕'}</span>
      <div class="sugg">${full?'':(g&&g.suggestion?g.suggestion:'')}</div>`;
    cats.appendChild(row);
  }
  document.getElementById('mDetail').innerHTML=
    `<b>Action to improve:</b><br>`+(gaps.length?gaps.slice(0,3).map(g=>`• ${g.cat} — ${g.suggestion||'補分'}`).join('<br>'):'All full — keep it up! 💪')+
    `<br><br><b>Chapter rank:</b> #${m.rank}${m.hk_rank?`　·　<b>HK rank:</b> ${m.hk_rank}`:''}`;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){document.getElementById('overlay').classList.remove('show');}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
render();
</script>
</body>
</html>
