<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Firebean — Leave</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --brand:#ff3333; --ink:#0a0a0a; --dim:#8a8a8a; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--ink); color:#f4f4f4;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:32px 24px; -webkit-font-smoothing:antialiased;
  }
  .box{max-width:400px; width:100%; text-align:center}
  .mark{
    font-family:'Anton',sans-serif; font-size:13px; letter-spacing:.34em;
    text-transform:uppercase; color:var(--dim); margin-bottom:38px;
  }
  .mark i{ color:var(--brand); font-style:normal; }
  h1{
    font-family:'Anton',sans-serif; font-size:clamp(52px,17vw,84px);
    line-height:.9; letter-spacing:-.01em; margin:0; text-transform:uppercase;
  }
  h1 span{ display:block; color:var(--brand) }
  .sub{
    font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:.28em;
    text-transform:uppercase; color:var(--dim); margin-top:22px;
  }
  .bar{
    height:2px; background:rgba(255,255,255,.1); border-radius:2px;
    margin:34px auto 0; max-width:180px; overflow:hidden;
  }
  .bar i{
    display:block; height:100%; width:38%; background:var(--brand);
    border-radius:2px; animation:run 1.1s ease-in-out infinite;
  }
  @keyframes run{ 0%{transform:translateX(-100%)} 100%{transform:translateX(360%)} }
  .btn{
    display:inline-block; margin-top:34px; padding:15px 34px;
    border:1px solid rgba(255,255,255,.22); border-radius:999px;
    font-family:'Oswald',sans-serif; font-size:11px; font-weight:500;
    letter-spacing:.22em; text-transform:uppercase; color:#fff;
    text-decoration:none; transition:background .2s, border-color .2s;
  }
  .btn:hover{ background:var(--brand); border-color:var(--brand) }
  .note{
    font-size:11.5px; color:#666; line-height:1.7; margin-top:30px;
  }
  .note b{ color:#999; font-weight:500 }
</style>
</head>
<body>
  <div class="box">
    <div class="mark"><i>/</i> FIREBEAN</div>
    <h1>Leave<span>App</span></h1>
    <div class="sub">Signing you in</div>
    <div class="bar"><i></i></div>
    <a class="btn" id="go" href="#">Open now</a>
    <p class="note">
      You need a <b>@firebean.net</b> Google account.<br>
      If nothing happens, tap “Open now”.
    </p>
  </div>

<script>
  var TARGET = "https://script.google.com/a/macros/firebean.net/s/AKfycbyQEjcoYsim4ezWah7RT4DT00dKikS95VHKVLpOhDE9NtqaCFBRUBUgUXQPJZ2vpeYg/exec";

  document.getElementById("go").href = TARGET;

  // 少少延遲，等品牌畫面閃一閃，唔好白屏跳走
  setTimeout(function () {
    location.replace(TARGET);
  }, 900);
</script>
</body>
</html>
