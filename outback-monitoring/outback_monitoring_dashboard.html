<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Outback Steakhouse HK - 社交聆聽監控儀表板</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --accent: #e8291c;
    --text: #e2e8f0; --muted: #94a3b8; --border: #334155;
    --pos: #22c55e; --neg: #ef4444; --neu: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.6; }
  .header { background: linear-gradient(135deg, #1e293b, #0f172a);
            border-bottom: 3px solid var(--accent); padding: 24px 32px; }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .header .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .header .sub a { color: var(--accent); }
  .nav { display: flex; gap: 4px; padding: 12px 32px; background: #1a2332;
         border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; overflow-x: auto; }
  .nav a { padding: 8px 14px; border-radius: 6px; text-decoration: none;
           color: var(--muted); font-size: 12px; font-weight: 600; transition: 0.2s; white-space: nowrap; }
  .nav a:hover { background: var(--card); color: var(--text); }
  .nav a.active { background: var(--accent); color: #fff; }
  .date-picker { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  .date-picker input, .date-picker select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; font-size: 13px; }
  .date-picker button, .search-box button { background: var(--accent); color: #fff; border: none;
    padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .search-box { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .search-box input { min-width: 210px; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; font-size: 13px; }
  .search-status { color: var(--muted); font-size: 12px; min-width: 70px; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
          gap: 16px; margin-bottom: 32px; }
  .stat-card { background: var(--card); border-radius: 12px; padding: 20px;
               border: 1px solid var(--border); }
  .stat-card .num { font-size: 32px; font-weight: 800; }
  .stat-card .label { font-size: 12px; color: var(--muted); text-transform: uppercase;
                      letter-spacing: 0.08em; margin-top: 4px; }
  .stat-card.positive { border-left: 3px solid var(--pos); }
  .stat-card.negative { border-left: 3px solid var(--neg); }
  .stat-card.neutral { border-left: 3px solid var(--neu); }
  .stat-card.warn { border-left: 3px solid var(--accent); }
  .section { margin-bottom: 32px; }
  .section h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px;
                padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .card { background: var(--card); border-radius: 10px; padding: 16px;
          border: 1px solid var(--border); margin-bottom: 12px; }
  .card .meta { display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
                font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .card .tag { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .tag.pos { background: #166534; color: var(--pos); }
  .tag.neg { background: #7f1d1d; color: var(--neg); }
  .tag.neu { background: #713f12; color: var(--neu); }
  .tag.pri-high { background: #7f1d1d; color: var(--neg); }
  .tag.pri-med { background: #713f12; color: var(--neu); }
  .tag.pri-low { background: #1e3a5f; color: #60a5fa; }
  .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .card h3 a { color: var(--text); text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .card p { font-size: 13px; color: var(--muted); }
  .card .links { margin-top: 8px; }
  .card .links a { font-size: 12px; color: var(--accent); text-decoration: none; }
  .empty { text-align: center; padding: 48px; color: var(--muted); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  @media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
  .swot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .swot-card { background: var(--card); border-radius: 10px; padding: 16px; border: 1px solid var(--border); }
  .swot-card.s { border-top: 3px solid var(--pos); }
  .swot-card.w { border-top: 3px solid var(--neg); }
  .swot-card.o { border-top: 3px solid #3b82f6; }
  .swot-card.t { border-top: 3px solid var(--accent); }
  .swot-card h3 { font-size: 14px; margin-bottom: 8px; }
  .swot-card ul { list-style: none; font-size: 13px; }
  .swot-card li { padding: 4px 0; }
  @media (max-width: 640px) {
    .container { padding: 16px; }
    .header { padding: 16px; }
    .nav { padding: 8px 16px; }
    .grid, .swot-grid, .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .date-picker { margin-left: 0; width: 100%; }
  }
  .timeline { position: relative; padding-left: 20px; }
  .timeline::before { content: ''; position: absolute; left: 6px; top: 0; bottom: 0;
    width: 2px; background: var(--border); }
  .tl-item { position: relative; padding: 8px 0 8px 16px; }
  .tl-item::before { content: ''; position: absolute; left: -14px; top: 14px;
    width: 8px; height: 8px; border-radius: 50%; }
  .tl-item.competitor::before { background: var(--accent); }
  .tl-item.campaign::before { background: var(--pos); }
  .tl-item.other::before { background: var(--neu); }
  .tl-date { font-size: 11px; color: var(--muted); }
  .tl-text { font-size: 13px; }
  .cmp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .cmp-table th, .cmp-table td { padding: 10px 12px; text-align: left;
    border-bottom: 1px solid var(--border); }
  .cmp-table th { background: var(--card); font-size: 12px; color: var(--muted); }
  .cmp-table tr:hover td { background: rgba(255,255,255,0.02); }
</style>
</head>
<body>

<div class="header">
  <h1>Outback Steakhouse HK - 社交聆聽監控儀表板</h1>
  <div class="sub">每日自動監控 45+ 來源 · 最後更新：2026-08-13 - <a href="https://docs.google.com/spreadsheets/d/1uj_3EYaeJFcIYOXJhECJXzmFb3643issOrKIB4WTSe4/edit" target="_blank">Google Sheet</a></div>
</div>

<div class="nav" id="nav">
  <a href="#" class="active" onclick="showView('daily')">每日</a>
  <a href="#" onclick="showView('weekly')">週報</a>
  <a href="#" onclick="showView('monthly')">月報</a>
  <a href="#" onclick="showView('all')">完整記錄</a>
  <a href="#" onclick="showView('analysis')">分析與建議</a>
  <a href="#" onclick="showView('competitors')">競爭對手</a>
  <a href="#" onclick="showView('sources')">來源</a>
  <div class="date-picker" id="datePicker">
    <input type="date" id="dateInput" aria-label="選擇日期"/>
    <select id="periodSelect" aria-label="日期範圍">
      <option value="day">單日</option>
      <option value="3days">3日</option>
      <option value="week">7日</option>
      <option value="month">30日</option>
    </select>
    <button onclick="loadDate()">日期搜尋</button>
  </div>
  <div class="search-box">
    <input type="search" id="textSearch" placeholder="搜尋標題、內容、作者或來源" aria-label="文字搜尋" oninput="filterMentions()"/>
    <button onclick="filterMentions()">文字搜尋</button>
    <span class="search-status" id="searchStatus"></span>
  </div>
</div>

<div class="container" id="app">
  <div class="empty">Loading data...</div>
</div>

<script>
const GITHUB_BASE = 'https://raw.githubusercontent.com/cs627/Firebean-Website/main/outback-monitoring/data';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1uj_3EYaeJFcIYOXJhECJXzmFb3643issOrKIB4WTSe4/edit';

let currentView = 'daily';

function showView(view) {
  currentView = view;
  document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
  document.querySelectorAll('.nav a').forEach(a => {
    if ((view === 'daily' && a.textContent.includes('每日')) ||
        (view === 'weekly' && a.textContent.includes('週報')) ||
        (view === 'monthly' && a.textContent.includes('月報')) ||
        (view === 'all' && a.textContent.includes('完整')) ||
        (view === 'analysis' && a.textContent.includes('分析')) ||
        (view === 'competitors' && a.textContent.includes('競爭')) ||
        (view === 'sources' && a.textContent.includes('來源'))) {
      a.classList.add('active');
    }
  });
  document.getElementById('datePicker').style.display = (view === 'daily') ? 'flex' : 'none';
  render();
}

async function fetchJSON(url) {
  try {
    const resp = await fetch(url);
    if (resp.ok) return await resp.json();
  } catch(e) {}
  return null;
}

async function loadDate() {
  const dateStr = document.getElementById('dateInput').value;
  if (!dateStr) return;
  const period = document.getElementById('periodSelect').value;
  const app = document.getElementById('app');
  
  let dates = [dateStr];
  if (period === '3days' || period === 'week' || period === 'month') {
    const count = period === '3days' ? 3 : period === 'week' ? 7 : 30;
    const d = new Date(dateStr);
    dates = [];
    for (let i = 0; i < count; i++) {
      const nd = new Date(d);
      nd.setDate(nd.getDate() - i);
      dates.push(nd.toISOString().slice(0,10));
    }
  }
  
  app.innerHTML = '<div class="empty">Loading data for ' + dateStr + '...</div>';
  
  const results = await Promise.all(dates.map(d => fetchJSON(GITHUB_BASE + '/daily-' + d + '.json')));
  const valid = results.filter(r => r && r.items && r.items.length > 0);
  
  if (valid.length === 0) {
    app.innerHTML = '<div class="empty">沒有 ' + dateStr + ' 的數據</div>';
    return;
  }
  
  const allItems = [];
  const seen = new Set();
  valid.forEach(r => {
    (r.items || []).forEach(item => {
      const key = item.link + item.title;
      if (!seen.has(key)) { seen.add(key); allItems.push(item); }
    });
  });
  
  const pos = allItems.filter(i => i.sentiment === 'positive').length;
  const neg = allItems.filter(i => i.sentiment === 'negative').length;
  const neu = allItems.length - pos - neg;
  const merged = { items: allItems, alerts: valid.flatMap(r => r.alerts || []) };
  
  const periodLabel = period === 'day' ? '報告' : period === '3days' ? '3日' : period === 'week' ? '7日' : '30日';
  
  app.innerHTML = getHeader(periodLabel + ' - ' + dateStr, allItems.length) +
    getStatsGrid(allItems.length, pos, neu, neg) +
    renderAlerts(merged) +
    renderRecommendations({ recommendations: valid.flatMap(r => r.recommendations || []) }) +
    '<div class="section"><h2>文章</h2>' + renderItems(allItems) + '</div>';
  filterMentions();
}

function filterMentions() {
  const input = document.getElementById('textSearch');
  const status = document.getElementById('searchStatus');
  if (!input || !status) return;
  const query = input.value.trim().toLowerCase();
  const cards = Array.from(document.querySelectorAll('.mention-card'));
  let visible = 0;
  cards.forEach(function(card) {
    const match = !query || card.textContent.toLowerCase().includes(query);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  status.textContent = query ? visible + ' / ' + cards.length + ' 條' : '';
}

async function loadData() {
  const today = new Date().toISOString().slice(0,10);
  let data = await fetchJSON(GITHUB_BASE + '/daily-' + today + '.json');
  if (data && data.items && data.items.length > 0) return data;
  const yesterday = new Date(Date.now() - 864e5).toISOString().slice(0,10);
  return await fetchJSON(GITHUB_BASE + '/daily-' + yesterday + '.json');
}

async function loadWeekly() { return await fetchJSON(GITHUB_BASE + '/weekly-latest.json'); }
async function loadMonthly() { return await fetchJSON(GITHUB_BASE + '/monthly-latest.json'); }

function getHeader(title, count) {
  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;">' +
    '<h2 style="font-size:18px;">' + title + '</h2>' +
    '<span style="font-size:13px;color:var(--muted);">' + count + ' 條記錄</span></div>';
}

function getStatsGrid(total, pos, neu, neg) {
  return '<div class="grid">' +
    '<div class="stat-card neutral"><div class="num">' + total + '</div><div class="label">總 Mentions</div></div>' +
    '<div class="stat-card positive"><div class="num">' + pos + '</div><div class="label">正面</div></div>' +
    '<div class="stat-card neutral"><div class="num">' + neu + '</div><div class="label">中性</div></div>' +
    '<div class="stat-card negative"><div class="num">' + neg + '</div><div class="label">負面</div></div>' +
    '</div>';
}

function renderItems(items) {
  if (!items || items.length === 0) return '<div class="empty">暫無文章</div>';
  return items.map(function(item) {
    const sentiment = item.sentiment || 'neutral';
    const tagClass = sentiment === 'positive' ? 'pos' : sentiment === 'negative' ? 'neg' : 'neu';
    const tagLabel = sentiment === 'positive' ? '正面' : sentiment === 'negative' ? '負面' : '中性';
    return '<div class="card mention-card">' +
      '<div class="meta">' +
        '<span class="tag ' + tagClass + '">' + tagLabel + '</span>' +
        '<span>' + (item.source || '') + '</span>' +
        '<span>' + (item.author || '') + '</span>' +
        '<span>' + (item.date || '') + '</span>' +
        (item.tags ? '<span>主題：' + item.tags + '</span>' : '') +
      '</div>' +
      '<h3>' + (item.link ? '<a href="' + item.link + '" target="_blank">' + item.title + '</a>' : item.title) + '</h3>' +
      '<p>' + (item.summary || '') + '</p>' +
      '<div class="links">' +
        (item.link ? '<a href="' + item.link + '" target="_blank">原文</a>' : '') +
      '</div>' +
    '</div>';
  }).join('');
}

function renderAlerts(data) {
  if (!data || !data.alerts || data.alerts.length === 0) return '';
  return '<div class="section"><h2>警報</h2>' +
    data.alerts.map(function(a) {
      return '<div class="card" style="border-left:3px solid var(--neg);">' +
        '<div class="meta"><span class="tag neg">' + (a.severity || a.level || 'MEDIUM') + '</span><span>' + (a.source || '') + '</span></div>' +
        '<h3>' + a.title + '</h3><p>' + (a.summary || '') + '</p>' +
        (a.link ? '<div class="links"><a href="' + a.link + '" target="_blank">詳情</a></div>' : '') +
      '</div>';
    }).join('') +
  '</div>';
}

function renderRecommendations(data) {
  if (!data || !data.recommendations || data.recommendations.length === 0) return '';
  return '<div class="section"><h2>建議</h2>' +
    data.recommendations.map(function(r) { return '<div class="card"><p>' + r + '</p></div>'; }).join('') +
  '</div>';
}

function renderTrends(data) {
  if (!data || !data.trends) return '';
  return '<div class="section"><h2>趨勢分析</h2><div class="card"><p>' + data.trends + '</p></div></div>';
}

function renderAnalysisView() {
  return '<div class="section">' +
  '<h2>分析與建議 S1 - SWOT 分析</h2>' +
  '<div class="swot-grid">' +
    '<div class="swot-card s"><h3>優勢 (Strengths)</h3><ul>' +
      '<li>黑糖麵包品牌辨識度極高，成 iconic 記憶點</li>' +
      '<li>高性價比扒房定位（128午餐起）</li>' +
      '<li>親子友善形象（兒童餐78、BB凳、蠟筆套裝）</li>' +
      '<li>會員制度（生日賞、每月優惠）增強忠誠度</li>' +
      '<li>IG 持續推廣 Happy Hour / 下午茶，話題感強</li>' +
    '</ul></div>' +
    '<div class="swot-card w"><h3>劣勢 (Weaknesses)</h3><ul>' +
      '<li>2024年關閉9間分店後僅餘10間，網絡縮小</li>' +
      '<li>LIHKG 持續討論收皮議題，負面印象殘留</li>' +
      '<li>Threads 荃灣西牛扒投訴約24.1萬瀏覽，食物品質及服務補救風險突出</li>' +
      '<li>價格帶較窄：高端客被 Flat Iron/扒房搶走</li>' +
      '<li>Instagram／Threads 登入及反爬限制令平台內搜尋覆蓋不完整</li>' +
    '</ul></div>' +
    '<div class="swot-card o"><h3>機會 (Opportunities)</h3><ul>' +
      '<li>Investing.com 報導母公司 BLMN 業績超預期</li>' +
      '<li>可加強小紅書/Threads 社交聆聽覆蓋</li>' +
      '<li>世界盃/節日推廣（已成功推出 4K直播活動）</li>' +
      '<li>與滙豐信用卡等銀行合作推廣效果良好</li>' +
      '<li>可開拓到會/外賣禮盒新收入來源</li>' +
    '</ul></div>' +
    '<div class="swot-card t"><h3>威脅 (Threats)</h3><ul>' +
      '<li>Flat Iron Steak（7間分店、498二人份）直接競爭</li>' +
      '<li>Ruby Tuesday 仍有市場聲音、Happy Hour 推廣</li>' +
      '<li>北上消費潮持續，影響本地扒房整體生意</li>' +
      '<li>食材成本上升 + 租金壓力</li>' +
      '<li>高觸達負面UGC若被媒體轉載，可能擴大至食品品質與服務流程議題</li>' +
    '</ul></div>' +
  '</div></div>' +

  '<div class="section">' +
  '<h2>分析與建議 S2 - 優先行動清單</h2>' +
  '<div class="card" style="border-left:3px solid var(--neg);">' +
    '<div class="meta"><span class="tag pri-high">HIGH</span> 立即處理</div>' +
    '<h3>Threads 荃灣西牛扒投訴：高觸達食品品質及服務補救風險</h3>' +
    '<p>原帖約24.1萬瀏覽、1.1K讚、237回覆及516分享／傳送，並有二次引用。建議立即核查涉事分店熟度、退換及翻煮流程，預備同理心回覆並在48小時內監察衍生討論。</p>' +
  '</div>' +
  '<div class="card" style="border-left:3px solid var(--neu);">' +
    '<div class="meta"><span class="tag pri-med">MEDIUM</span> 本週跟進</div>' +
    '<h3>Flat Iron Steak 競爭威脅分析</h3>' +
    '<p>Flat Iron 7間分店，主打 498 二人份 Jack\'s Creek 牛扒，與 Outback 價格帶重疊。建議持續監控其推廣活動及新菜單。</p>' +
  '</div>' +
  '<div class="card" style="border-left:3px solid var(--neu);">' +
    '<div class="meta"><span class="tag pri-med">MEDIUM</span> 本週跟進</div>' +
    '<h3>Threads/小紅書社交聆聽強化</h3>' +
    '<p>Agent C 已加強 Threads 搜索（直接 browser search），建議 N8N Puppeteer 工作流作後備監控。</p>' +
  '</div>' +
  '<div class="card" style="border-left:3px solid #3b82f6;">' +
    '<div class="meta"><span class="tag pri-low">LOW</span> 持續監控</div>' +
    '<h3>母公司 BLMN 財務表現</h3>' +
    '<p>BMO 上調目標價至 12，Q2 EPS 0.39 超預期。建議每月檢查母公司財報。</p>' +
  '</div></div>' +

  '<div class="section">' +
  '<h2>分析與建議 S3 - 風險監控地圖</h2>' +
  '<div class="stat-card warn" style="margin-bottom:12px;">' +
    '<div class="num">3</div><div class="label">活躍風險項目（需每日／每週檢視）</div>' +
  '</div>' +
  '<div class="grid-2">' +
    '<div class="card"><h3>Threads 荃灣西牛扒投訴</h3>' +
      '<p><span class="tag neg">高</span> 來源：Threads 觸達：約24.1萬瀏覽</p>' +
      '<p>關鍵詞：熟度、翻煮、凍湯、肚痛。需每日監控並完成內部核查。</p>' +
    '</div>' +
    '<div class="card"><h3>LIHKG 業務前景負面討論</h3>' +
      '<p><span class="tag neu">中</span> 來源：LIHKG；本次直接頁面受存取限制</p>' +
      '<p>關鍵詞：收皮、關店、執笠。保留觀察，但不在沒有新證據時重複計數。</p>' +

function renderSourcesView() {
  var html = '<div class="section"><h2>監控來源一覽 (46 個目標來源)</h2>';
  for (var cat in SOURCES) {
    if (!SOURCES.hasOwnProperty(cat)) continue;
    html += '<div style="background:var(--card);border-radius:10px;padding:16px;border:1px solid var(--border);margin-bottom:12px;">';
    html += '<h3 style="font-size:14px;margin-bottom:10px;color:var(--accent);">' + cat + '</h3>';
    html += '<table style="width:100%;border-collapse:collapse;font-size:12px;">';
    SOURCES[cat].forEach(function(s) {
      html += '<tr><td style="padding:4px 0;">' + s[0] + '</td><td style="padding:4px 0;text-align:right;color:var(--muted);">' + s[1] + '</td></tr>';
    });
    html += '</table></div>';
  }
  html += '<p style="font-size:13px;color:var(--muted);margin-top:16px;">數據來源：Google Sheet GitHub Pages 此儀表板展示</p>';
  html += '<p style="font-size:13px;"><a href="' + SHEET_URL + '" target="_blank" style="color:var(--accent);">前往 Google Sheet</a></p></div>';
  return html;
}

async function render() {
  const app = document.getElementById('app');
  
  if (currentView === 'analysis') {
    app.innerHTML = renderAnalysisView();
    return;
  }
  
  if (currentView === 'competitors') {
    app.innerHTML = renderCompetitorsView();
    return;
  }
  
  if (currentView === 'sources') {
    app.innerHTML = renderSourcesView();
    return;
  }
  
  if (currentView === 'weekly') {
    const data = await loadWeekly();
    if (!data) { app.innerHTML = '<div class="empty">暫無週報數據</div>'; return; }
    app.innerHTML = getHeader('週報 - ' + (data.week || '最新'), data.items.length) +
      getStatsGrid(data.items.length,
        data.items.filter(function(i){return i.sentiment==='positive'}).length,
        data.items.filter(function(i){return !i.sentiment||i.sentiment==='neutral'}).length,
        data.items.filter(function(i){return i.sentiment==='negative'}).length) +
      renderTrends(data) +
      renderAlerts(data) +
      renderRecommendations(data) +
      '<div class="section"><h2>記錄</h2>' + renderItems(data.items) + '</div>';
    return;
  }
  
  if (currentView === 'monthly') {
    const data = await loadMonthly();
    if (!data) { app.innerHTML = '<div class="empty">暫無月報數據</div>'; return; }
    app.innerHTML = getHeader('月報 - ' + (data.month || '最新'), data.items.length) +
      getStatsGrid(data.items.length,
        data.items.filter(function(i){return i.sentiment==='positive'}).length,
        data.items.filter(function(i){return !i.sentiment||i.sentiment==='neutral'}).length,
        data.items.filter(function(i){return i.sentiment==='negative'}).length) +
      renderTrends(data) +
      renderAlerts(data) +
      renderRecommendations(data) +
      '<div class="section"><h2>記錄</h2>' + renderItems(data.items) + '</div>';
    return;
  }
  
  if (currentView === 'all') {
    const data = await loadMonthly();
    if (!data) { app.innerHTML = '<div class="empty">暫無數據</div>'; return; }
    const srcCounts = {};
    data.items.forEach(function(i) { var s = i.source || '其他'; srcCounts[s] = (srcCounts[s] || 0) + 1; });
    var srcHtml = Object.keys(srcCounts).sort(function(a,b){return srcCounts[b]-srcCounts[a]}).map(function(k) {
      return '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;"><span>' + k + '</span><span style="color:var(--muted);">' + srcCounts[k] + '</span></div>';
    }).join('');
    
    app.innerHTML = getHeader('完整記錄 (' + (data.month || '最新') + ')', data.items.length) +
      getStatsGrid(data.items.length,
        data.items.filter(function(i){return i.sentiment==='positive'}).length,
        data.items.filter(function(i){return !i.sentiment||i.sentiment==='neutral'}).length,
        data.items.filter(function(i){return i.sentiment==='negative'}).length) +
      '<div class="section"><h2>來源分佈</h2><div class="card">' + srcHtml + '</div></div>' +
      renderAlerts(data) +
      renderRecommendations(data) +
      '<div class="section"><h2>所有記錄</h2>' + renderItems(data.items) + '</div>';
    return;
  }
  
  // Default: daily
  const data = await loadData();
  if (!data) { app.innerHTML = '<div class="empty">暫無今日數據</div>'; return; }
  const pos = data.items.filter(function(i){return i.sentiment==='positive'}).length;
  const neg = data.items.filter(function(i){return i.sentiment==='negative'}).length;
  const neu = data.items.length - pos - neg;
  const dateLabel = data.date || new Date().toISOString().slice(0,10);
  app.innerHTML = getHeader('每日報告 - ' + dateLabel, data.items.length) +
    getStatsGrid(data.items.length, pos, neu, neg) +
    renderAlerts(data) +
    renderTrends(data) +
    renderRecommendations(data) +
    '<div class="section"><h2>文章</h2>' + renderItems(data.items) + '</div>';
  filterMentions();
}

// Initial load
render();
