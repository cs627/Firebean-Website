<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Outback Steakhouse HK — 監控儀表板</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --accent: #e8291c;
    --text: #e2e8f0; --muted: #94a3b8; --border: #334155;
    --pos: #22c55e; --neg: #ef4444; --neu: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.6; }
  .header { background: linear-gradient(135deg, #1e293b, #0f172a);
            border-bottom: 3px solid var(--accent); padding: 24px 32px; }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .header .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .nav { display: flex; gap: 4px; padding: 12px 32px; background: #1a2332;
         border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .nav a { padding: 8px 16px; border-radius: 6px; text-decoration: none;
           color: var(--muted); font-size: 13px; font-weight: 600; transition: 0.2s; }
  .nav a:hover { background: var(--card); color: var(--text); }
  .nav a.active { background: var(--accent); color: #fff; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
          gap: 16px; margin-bottom: 32px; }
  .stat-card { background: var(--card); border-radius: 12px; padding: 20px;
               border: 1px solid var(--border); }
  .stat-card .num { font-size: 32px; font-weight: 800; }
  .stat-card .label { font-size: 12px; color: var(--muted); text-transform: uppercase;
                      letter-spacing: 0.08em; margin-top: 4px; }
  .stat-card.positive { border-left: 3px solid var(--pos); }
  .stat-card.negative { border-left: 3px solid var(--neg); }
  .stat-card.neutral { border-left: 3px solid var(--neu); }
  .section { margin-bottom: 32px; }
  .section h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px;
                padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .card { background: var(--card); border-radius: 10px; padding: 16px;
          border: 1px solid var(--border); margin-bottom: 12px; }
  .card .meta { display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
                font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .card .tag { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .tag.pos { background: #166534; color: var(--pos); }
  .tag.neg { background: #7f1d1d; color: var(--neg); }
  .tag.neu { background: #713f12; color: var(--neu); }
  .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .card h3 a { color: var(--text); text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .card p { font-size: 13px; color: var(--muted); }
  .card .links { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .card .links a { font-size: 12px; color: var(--accent); text-decoration: none; }
  .card .links a:hover { text-decoration: underline; }
  .screenshot { max-width: 100%; border-radius: 6px; margin-top: 8px;
                border: 1px solid var(--border); cursor: pointer;
                transition: transform 0.2s; }
  .screenshot:hover { transform: scale(1.02); }
  .empty { text-align: center; padding: 48px; color: var(--muted); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px;
           font-size: 11px; font-weight: 600; }
  .badge.daily { background: #1e3a5f; color: #60a5fa; }
  .badge.weekly { background: #3b1f5e; color: #c084fc; }
  .badge.monthly { background: #5f1e1e; color: #fca5a5; }
  @media (max-width: 640px) {
    .container { padding: 16px; }
    .header { padding: 16px; }
    .nav { padding: 8px 16px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🔍 Outback Steakhouse HK — 監控儀表板</h1>
  <div class="sub">每日自動監控 14+ 平台 · 實時更新 · 截圖存檔</div>
</div>

<div class="nav" id="nav">
  <a href="#" class="active" onclick="showView('daily')">📅 每日報告</a>
  <a href="#" onclick="showView('weekly')">📆 週報</a>
  <a href="#" onclick="showView('monthly')">📊 月報</a>
  <a href="#" onclick="showView('all')">📋 完整記錄</a>
</div>

<div class="container" id="app">
  <div class="empty">Loading data...</div>
</div>

<script>
const GITHUB_BASE = 'https://raw.githubusercontent.com/cs627/Firebean-Website/main/outback-monitoring/data';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1uj_3EYaeJFcIYOXJhECJXzmFb3643issOrKIB4WTSe4/edit';

let currentView = 'daily';

function showView(view) {
  currentView = view;
  document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
  document.querySelectorAll('.nav a').forEach(a => {
    if ((view === 'daily' && a.textContent.includes('每日')) ||
        (view === 'weekly' && a.textContent.includes('週報')) ||
        (view === 'monthly' && a.textContent.includes('月報')) ||
        (view === 'all' && a.textContent.includes('完整'))) {
      a.classList.add('active');
    }
  });
  render();
}

async function loadData() {
  try {
    const today = new Date().toISOString().slice(0,10);
    const resp = await fetch(`${GITHUB_BASE}/daily-${today}.json`);
    if (resp.ok) return await resp.json();
    // fallback: try yesterday
    const yesterday = new Date(Date.now() - 864e5).toISOString().slice(0,10);
    const resp2 = await fetch(`${GITHUB_BASE}/daily-${yesterday}.json`);
    if (resp2.ok) return await resp2.json();
    return null;
  } catch(e) {
    return null;
  }
}

async function loadWeekly() {
  try {
    const resp = await fetch(`${GITHUB_BASE}/weekly-latest.json`);
    if (resp.ok) return await resp.json();
    return null;
  } catch(e) { return null; }
}

async function loadMonthly() {
  try {
    const resp = await fetch(`${GITHUB_BASE}/monthly-latest.json`);
    if (resp.ok) return await resp.json();
    return null;
  } catch(e) { return null; }
}

function renderStatCards(data) {
  if (!data || !data.items) return '';
  const pos = data.items.filter(i => i.sentiment === 'positive').length;
  const neg = data.items.filter(i => i.sentiment === 'negative').length;
  const neu = data.items.filter(i => !i.sentiment || i.sentiment === 'neutral').length;
  const total = data.items.length;
  return `
    <div class="grid">
      <div class="stat-card neutral">
        <div class="num">${total}</div>
        <div class="label">總 Mentions</div>
      </div>
      <div class="stat-card positive">
        <div class="num">${pos}</div>
        <div class="label">正面</div>
      </div>
      <div class="stat-card neutral">
        <div class="num">${neu}</div>
        <div class="label">中性</div>
      </div>
      <div class="stat-card negative">
        <div class="num">${neg}</div>
        <div class="label">負面</div>
      </div>
    </div>`;
}

function renderItems(items) {
  if (!items || items.length === 0) return '<div class="empty">📭 今日暫無新文章</div>';
  return items.map(item => {
    const sentiment = item.sentiment || 'neutral';
    const tagClass = sentiment === 'positive' ? 'pos' : sentiment === 'negative' ? 'neg' : 'neu';
    const tagLabel = sentiment === 'positive' ? '正面' : sentiment === 'negative' ? '負面' : '中性';
    const hasScreenshot = item.screenshot && item.screenshot !== '';
    return `
      <div class="card">
        <div class="meta">
          <span class="tag ${tagClass}">${tagLabel}</span>
          <span>${item.source || ''}</span>
          <span>${item.date || ''}</span>
          ${item.platform ? `<span class="badge ${item.platform}">${item.platform}</span>` : ''}
        </div>
        <h3>${item.link ? `<a href="${item.link}" target="_blank">${item.title}</a>` : item.title}</h3>
        <p>${item.summary || ''}</p>
        <div class="links">
          ${item.link ? `<a href="${item.link}" target="_blank">🔗 原文</a>` : ''}
          ${hasScreenshot ? `<a href="${item.screenshot}" target="_blank">📸 截圖</a>` : ''}
          ${item.sheet_url ? `<a href="${item.sheet_url}" target="_blank">📊 Sheet</a>` : ''}
        </div>
        ${hasScreenshot ? `<img class="screenshot" src="${item.screenshot}" alt="Screenshot" onclick="window.open(this.src)"/>` : ''}
      </div>
    `;
  }).join('');
}

function renderRecommendations(data) {
  if (!data || !data.recommendations || data.recommendations.length === 0) return '';
  return `
    <div class="section">
      <h2>🎯 建議</h2>
      ${data.recommendations.map(r => `<div class="card"><p>${r}</p></div>`).join('')}
    </div>`;
}

function renderAlerts(data) {
  if (!data || !data.alerts || data.alerts.length === 0) return '';
  return `
    <div class="section">
      <h2>🔴 警報</h2>
      ${data.alerts.map(a => `
        <div class="card" style="border-left: 3px solid var(--neg);">
          <div class="meta"><span class="tag neg">${a.severity || 'MEDIUM'}</span><span>${a.source || ''}</span></div>
          <h3>${a.title}</h3>
          <p>${a.summary}</p>
          ${a.link ? `<div class="links"><a href="${a.link}" target="_blank">🔗 詳情</a></div>` : ''}
        </div>
      `).join('')}
    </div>`;
}

function renderTrends(data) {
  if (!data || !data.trends) return '';
  return `
    <div class="section">
      <h2>📈 趨勢分析</h2>
      <div class="card"><p>${data.trends}</p></div>
    </div>`;
}

async function render() {
  const app = document.getElementById('app');
  const data = await loadData();
  const weekly = await loadWeekly();
  const monthly = await loadMonthly();

  if (currentView === 'daily') {
    app.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;">
        <h2 style="font-size:18px;">📅 每日報告 — ${data ? data.date : '今日'}</h2>
        <a href="${SHEET_URL}" target="_blank" style="font-size:13px;color:var(--accent);">📊 查看 Google Sheet →</a>
      </div>
      ${renderAlerts(data)}
      ${renderStatCards(data)}
      <div class="section">
        <h2>📰 文章</h2>
        ${renderItems(data ? data.items : [])}
      </div>
      ${renderRecommendations(data)}
      ${renderTrends(data)}
      <div class="section">
        <h2>📸 所有 Screenshots</h2>
        <div class="card">
          <p>截圖儲存於: <code>outback-monitoring/screenshots/</code></p>
          <p>每張截圖在 Column G 有對應路徑</p>
        </div>
      </div>
    `;
  } else if (currentView === 'weekly') {
    app.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h2 style="font-size:18px;">📆 週報 — ${weekly ? weekly.week : '最新'}</h2>
      </div>
      ${weekly ? renderStatCards(weekly) + renderItems(weekly.items) + renderRecommendations(weekly) + renderTrends(weekly) : '<div class="empty">📭 週報資料準備中</div>'}
    `;
  } else if (currentView === 'monthly') {
    app.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h2 style="font-size:18px;">📊 月報 — ${monthly ? monthly.month : '最新'}</h2>
      </div>
      ${monthly ? renderStatCards(monthly) + renderItems(monthly.items) + renderRecommendations(monthly) + renderTrends(monthly) : '<div class="empty">📭 月報資料準備中</div>'}
    `;
  } else if (currentView === 'all') {
    app.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h2 style="font-size:18px;">📋 完整記錄</h2>
        <a href="${SHEET_URL}" target="_blank" style="font-size:13px;color:var(--accent);">📊 查看完整 Google Sheet →</a>
      </div>
      <div class="card">
        <p>所有 Outback 監控記錄儲存於 Google Sheet：</p>
        <div class="links" style="margin-top:12px;">
          <a href="${SHEET_URL}" target="_blank">📊 打開 Google Sheet</a>
        </div>
        <p style="margin-top:16px;font-size:13px;color:var(--muted);">
          Sheet 有 7 欄：日期 | 時間 | 來源 | 標題 | 摘要 | 連結 | 截圖/備註<br>
          Column G 包含截圖路徑，按日期篩選即可
        </p>
      </div>
      <div class="section">
        <h2>📁 資料架構</h2>
        <div class="card">
          <pre style="font-size:12px;color:var(--muted);">
outback-monitoring/
├── index.html              ← 你而家睇緊嘅頁面
├── style.css
├── data/
│   ├── daily-YYYY-MM-DD.json   ← 每日報告
│   ├── weekly-latest.json      ← 最新週報
│   └── monthly-latest.json     ← 最新月報
└── screenshots/
    └── YYYY-MM-DD/
        └── source_title.jpg    ← 截圖
          </pre>
        </div>
      </div>
    `;
  }
}

render();
</script>
</body>
</html>
