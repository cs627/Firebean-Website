<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outback Steakhouse Hong Kong — 社交聆聽監控</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#e8291c;--pos:#22c55e;--neg:#ef4444;--neu:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans HK",Arial,sans-serif;line-height:1.55}.header{padding:22px 28px;border-bottom:3px solid var(--accent);background:linear-gradient(135deg,#1e293b,#0f172a)}h1{margin:0;font-size:24px}.sub{margin-top:5px;color:var(--muted);font-size:13px}.sub a,.card a{color:#fb7185}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 28px;background:#182233;border-bottom:1px solid var(--line)}button,input,select{border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:7px 10px}button{background:var(--accent);border-color:var(--accent);font-weight:700;cursor:pointer}.tab{background:transparent;border-color:transparent;color:var(--muted)}.tab.active{background:var(--accent);color:#fff}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-left:auto}.controls input[type=search]{min-width:220px}.container{max-width:1200px;margin:auto;padding:24px 28px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:14px;margin:18px 0 28px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px}.stat .n{font-size:30px;font-weight:800}.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase}.stat.total{border-left:3px solid var(--neu)}.stat.pos{border-left:3px solid var(--pos)}.stat.neu{border-left:3px solid var(--neu)}.stat.neg{border-left:3px solid var(--neg)}section{margin-bottom:28px}section h2{font-size:18px;border-bottom:1px solid var(--line);padding-bottom:8px}.card{margin-bottom:11px}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:7px}.tag{padding:2px 7px;border-radius:4px;font-weight:700}.positive{background:#14532d;color:#86efac}.negative,.high{background:#7f1d1d;color:#fca5a5}.neutral,.medium{background:#713f12;color:#fcd34d}.low{background:#1e3a5f;color:#93c5fd}.card h3{margin:4px 0 7px;font-size:15px}.card p{margin:0;color:var(--muted);font-size:13px}.links{margin-top:9px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:45px}.small{font-size:12px;color:var(--muted)}.coverage{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.coverage .card{margin:0}.status{min-width:70px;color:var(--muted);font-size:12px}@media(max-width:760px){.header,.nav,.container{padding-left:15px;padding-right:15px}.stats,.coverage{grid-template-columns:1fr 1fr}.controls{margin-left:0;width:100%}.controls input[type=search]{min-width:0;flex:1}}@media(max-width:470px){.stats,.coverage{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header"><h1 id="brandTitle">Outback Steakhouse Hong Kong</h1><div class="sub">每日社交聆聽 · 46 個目標來源 · <a id="sheetLink" href="https://docs.google.com/spreadsheets/d/1uj_3EYaeJFcIYOXJhECJXzmFb3643issOrKIB4WTSe4/edit?gid=0#gid=0" target="_blank" rel="noopener noreferrer">Google Sheet</a></div></header>
<nav class="nav">
<button class="tab active" data-view="daily">每日</button><button class="tab" data-view="weekly">七日</button><button class="tab" data-view="monthly">月報</button>
<div class="controls"><input id="dateInput" type="date" aria-label="選擇日期"><select id="periodSelect" aria-label="日期範圍"><option value="day">單日</option><option value="3">3日</option><option value="7">7日</option><option value="30">30日</option></select><button id="dateButton">日期搜尋</button><input id="textSearch" type="search" placeholder="搜尋標題、內容、作者或來源" aria-label="文字搜尋"><span id="searchStatus" class="status"></span></div>
</nav>
<main class="container" id="app"><div class="empty">正在載入…</div></main>
<script>
const CFG={dataBase:"./data".replace(/\/$/,""),latestDate:"2026-08-13"};let currentView="daily";
const app=document.getElementById("app"),dateInput=document.getElementById("dateInput"),periodSelect=document.getElementById("periodSelect"),textSearch=document.getElementById("textSearch"),searchStatus=document.getElementById("searchStatus");dateInput.value=CFG.latestDate;
function esc(value){return String(value??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
function safeUrl(value){try{const u=new URL(String(value));return ["http:","https:"].includes(u.protocol)?u.href:""}catch{return ""}}
async function getJSON(url){try{const r=await fetch(url,{cache:"no-store"});return r.ok?await r.json():null}catch{return null}}
function stats(items){const p=items.filter(x=>x.sentiment==="positive").length,n=items.filter(x=>x.sentiment==="negative").length;return{total:items.length,positive:p,negative:n,neutral:items.length-p-n}}
function header(title,count){return `<div class="row"><h2>${esc(title)}</h2><span class="small">${count} 條記錄</span></div>`}
function statGrid(s){return `<div class="stats"><div class="stat total"><div class="n">${s.total}</div><div class="l">總 Mentions</div></div><div class="stat pos"><div class="n">${s.positive}</div><div class="l">正面</div></div><div class="stat neu"><div class="n">${s.neutral}</div><div class="l">中性</div></div><div class="stat neg"><div class="n">${s.negative}</div><div class="l">負面</div></div></div>`}
function renderItems(items){if(!items.length)return'<div class="empty">暫無記錄</div>';return items.map(item=>{const cls=item.sentiment==="positive"?"positive":item.sentiment==="negative"?"negative":"neutral",label=item.sentiment==="positive"?"正面":item.sentiment==="negative"?"負面":"中性",url=safeUrl(item.link);return `<article class="card mention-card"><div class="meta"><span class="tag ${cls}">${label}</span><span>${esc(item.source)}</span><span>${esc(item.author)}</span><span>${esc(item.date)}</span>${item.tags?`<span>主題：${esc(item.tags)}</span>`:""}</div><h3>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a>`:esc(item.title)}</h3><p>${esc(item.summary)}</p>${url?`<div class="links"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">原文</a></div>`:""}</article>`}).join("")}
function renderAlerts(alerts=[]){if(!alerts.length)return"";return `<section><h2>警報</h2>${alerts.map(a=>{const sev=String(a.severity||a.level||"MEDIUM").toUpperCase(),url=safeUrl(a.link);return `<div class="card"><div class="meta"><span class="tag ${sev.toLowerCase()}">${esc(sev)}</span><span>${esc(a.source)}</span></div><h3>${esc(a.title)}</h3><p>${esc(a.summary)}</p>${url?`<div class="links"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">詳情</a></div>`:""}</div>`}).join("")}</section>`}
function renderTextSection(title,value){if(!value)return"";return `<section><h2>${esc(title)}</h2><div class="card"><p>${esc(value)}</p></div></section>`}
function renderRecommendations(values=[]){if(!values.length)return"";return `<section><h2>建議</h2>${values.map(v=>`<div class="card"><p>${esc(v)}</p></div>`).join("")}</section>`}
function renderCoverage(c={}){const limits=c.limitations||[];return `<section><h2>來源覆蓋</h2><div class="coverage"><div class="card"><div class="small">目標來源</div><strong>${esc(c.target_sources??0)}</strong></div><div class="card"><div class="small">已檢查</div><strong>${esc(c.checked_sources??0)}</strong></div><div class="card"><div class="small">新增記錄</div><strong>${esc(c.new_records??0)}</strong></div></div>${limits.length?`<div class="card" style="margin-top:12px"><p>${limits.map(esc).join("<br>")}</p></div>`:""}</section>`}
function filterCards(){const q=textSearch.value.trim().toLowerCase(),cards=[...document.querySelectorAll(".mention-card")];let visible=0;cards.forEach(card=>{const ok=!q||card.textContent.toLowerCase().includes(q);card.hidden=!ok;if(ok)visible++});searchStatus.textContent=q?`${visible} / ${cards.length} 條`:""}
function paint(data,label){const items=data?.items||[],s=stats(items);app.innerHTML=header(label,items.length)+statGrid(s)+renderAlerts(data?.alerts)+renderTextSection("趨勢分析",data?.trends)+renderRecommendations(data?.recommendations)+renderCoverage(data?.coverage||{})+`<section><h2>記錄</h2>${renderItems(items)}</section>`;filterCards()}
function isoDaysBack(end,count){const d=new Date(`${end}T12:00:00Z`),out=[];for(let i=0;i<count;i++){const x=new Date(d);x.setUTCDate(x.getUTCDate()-i);out.push(x.toISOString().slice(0,10))}return out}
async function loadDailyRange(){const selected=dateInput.value||CFG.latestDate,count=periodSelect.value==="day"?1:Number(periodSelect.value),dates=isoDaysBack(selected,count),payloads=(await Promise.all(dates.map(d=>getJSON(`${CFG.dataBase}/daily-${d}.json`)))).filter(Boolean),items=[],alerts=[],recommendations=[],limitations=[],seen=new Set();payloads.forEach(p=>{(p.items||[]).forEach(i=>{const key=`${i.link}|${i.title}`;if(!seen.has(key)){seen.add(key);items.push(i)}});alerts.push(...(p.alerts||[]));recommendations.push(...(p.recommendations||[]));limitations.push(...(p.coverage?.limitations||[]))});paint({items,alerts,recommendations:[...new Set(recommendations)],trends:payloads.map(p=>p.trends).filter(Boolean).join(" "),coverage:{target_sources:payloads[0]?.coverage?.target_sources||0,checked_sources:payloads.reduce((n,p)=>n+(p.coverage?.checked_sources||0),0),new_records:items.length,limitations:[...new Set(limitations)]}},`${count===1?"每日報告":count+"日報告"} — ${selected}`)}
async function loadView(view){currentView=view;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.view===view));if(view==="daily")return loadDailyRange();const file=view==="weekly"?"weekly-latest.json":"monthly-latest.json",data=await getJSON(`${CFG.dataBase}/${file}`);if(!data){app.innerHTML='<div class="empty">暫無數據</div>';return}paint(data,view==="weekly"?`七日報告 — ${data.week||"最新"}`:`月報 — ${data.month||"最新"}`)}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>loadView(b.dataset.view)));document.getElementById("dateButton").addEventListener("click",loadDailyRange);textSearch.addEventListener("input",filterCards);loadView("daily");
</script>
</body>
</html>
